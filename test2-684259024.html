<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>684259024-Theeraphong</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;


            background-color: rgb(182, 195, 255);
        }

        .container{
            max-width: 1100px;
            padding: 0;
            margin: 0;
        }

        /* Header */
        .header {
            background-color: rgb(24, 38, 245);
            padding: 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 15px;
            color: white;
        }

        .nav-list {
            list-style: none;
            display: flex;

            gap: 15px;
            align-items: center;
        }
        .nav-list a{
            color: white;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            transition: all 0.8s;
        }
        .nav-list a:hover{
            background-color: rgb(81, 220, 255);
        }



        
    .main-layout{
    display: grid;
    gap: 20px;

    
    }

    .hero {
        background-color: rgb(81, 230, 250);

        overflow: hidden;
    }

    .textblue {
        background-color: blue;
    }


    .info-section {
        background-color: white;
        border-radius: 0.75rem;
        padding: 2.5rem 2rem;
        margin-top: 2rem;
    }

    .info-title {
        margin-bottom:  2rem;
    }

    .info-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
    }

    .info-card{
        padding: 1.5rem 1.2rem;
        border-radius: 0.5rem;
    }
    .info-card h3 {
        font-size: 1.1rem;
        margin-bottom: 0.75rem;

        text-align: center;
    }

     .info-card p {
        font-size: 0.9 rem;
        color: rgb(80, 80, 80);
        background-color: white;
    }

    .info-orange{
        background-color: rgb(253, 204, 147);
    }
    .info-orange h3 {
        color: rgb(250, 173, 29);
    }

    .info-blue {
        background-color: rgb(149, 149, 253);
    }
    .info-blue h3 {
        color: blue;
    }

    .info-purple {
        background-color: rgb(253, 154, 253);
    }
    .info-purple h3 {
        color: rgb(253, 39, 253);
    }

       /* Footer */
        footer {
            background-color: blue;
            color: white;
            padding-block: 1.25rem;
            margin-top: 2 rem;
        }

        /* Responsive */
        @media (max-width: 900px){
            .main-layout{
                grid-template-columns: 2fr ;
            }
        }

        @media (max-width: 600px){
            .main-layout{
                grid-template-columns: 1fr ;
            }

        }

        

    </style>
</head>

<body>
    <div class="container">
    <header class="header">
        <div class="header-content">
            <h1 class="header-title">SE024:Learning Hub</h1>
            </div>

        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="">หน้าแรก</a></li>
                <li><a href="">หลักสูตร</a></li>
                <li><a href="">ติดต่อเรา</a></li>
            </ul>
           </nav>
    </header>

     <!-- sidebar -->
         <main class="main-layout">
            <section class="left-content">
                 <!-- hero section -->
                 <section class="hero">
                    <div class="hero-text">
                        <h1>เริ่มต้นสร้างเว็บไซต์ในแบบของคุณ</h1>
                        <p>เรียนรู้การออกแบบและพัฒนาเว็บไซต์</p>
                        <p class="textblue">ดูหลักสูตรทั้งหมด</p>

                    </div>
                

        <div class="info-section">
    
                <h2 class="info-title">หลักสูตรแนะนำ</h2>
                <div class="info-grid">
                    <article class="info-card info-orange">
                        <h3>&lt;HTML&lt;</h3>
                        <p> HTML </p>
                    </article>
                    <article class="info-card info-blue">
                        <h3> CSS</h3>
                        <p>Responsive</p>
                    </article>
                    <article class="info-card info-purple">
                        <h3>UI/UX</h3>
                        <p>UI Design</p>
                    </article>
                </div>
    
        </div>

            </section>
    

    <footer>
        <p>&copy;2026 SE024: Learning Hub</p>
    </footer>
    </div>
</body>
</html>
